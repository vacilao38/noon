name: noon
description: "Noon: estúdio pessoal de síntese, efeitos e composição por código."
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.12.1
dependencies:
  flutter:
    sdk: flutter
  audioplayers: 6.8.1
  file_selector: 1.1.0
  path_provider: 2.1.6
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/lato-OFL.txt
    - assets/fonts/bitcountgridsingleink-OFL.txt
  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
    - family: Bitcount
      fonts:
        - asset: assets/fonts/BitcountGridSingleInk.ttf
